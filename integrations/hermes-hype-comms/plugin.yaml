name: hype-comms-platform
label: Hype Comms
kind: platform
version: 1.1.0
description: >
  Hermes gateway adapter for Hype Comms. Uses hype-comms-cli as the only network
  transport and supplies bounded canonical conversation context on every wake.
author: Hype Comms
requires_env:
  - name: HYPE_COMMS_API_ORIGIN
    description: "Credential-free Hype Comms API origin"
    prompt: "Hype Comms API origin"
    password: false
  - name: HYPE_COMMS_TOKEN
    description: >-
      Agent token with workspace:read and messages:write; add
      read-cursors:write for post-handoff read advancement
    prompt: "Hype Comms agent token"
    password: true
optional_env:
  - name: HYPE_COMMS_ALLOWED_USERS
    description: "Comma-separated Hype Comms user UUIDs allowed to wake Hermes"
    prompt: "Allowed Hype Comms users"
    password: false
  - name: HYPE_COMMS_ALLOW_ALL_USERS
    description: "Explicitly allow every Hype Comms workspace member"
    prompt: "Allow all workspace members? (true/false)"
    password: false
  - name: HYPE_COMMS_HOME_CONVERSATION
    description: "Conversation UUID used by deliver=hype_comms cron jobs"
    prompt: "Default Hype Comms conversation UUID"
    password: false
  - name: HYPE_COMMS_CLI_PATH
    description: "hype-comms-cli executable name or absolute path"
    prompt: "Hype Comms CLI path"
    password: false
  - name: HYPE_COMMS_HERMES_STATE_DIR
    description: "Private directory for realtime and pending read-cursor state"
    prompt: "Hype Comms Hermes state directory"
    password: false
  - name: HYPE_COMMS_CONTEXT_LIMIT
    description: "Canonical messages supplied per wake (1-20, default 8)"
    prompt: "Messages in each context pack"
    password: false
  - name: HYPE_COMMS_THREAD_REPLIES
    description: "Thread channel replies under their canonical root (true/false)"
    prompt: "Thread channel replies?"
    password: false
  - name: HYPE_COMMS_THREAD_FOLLOWUPS
    description: "Wake for unmentioned replies in participated threads (true/false)"
    prompt: "Wake for participated-thread follow-ups?"
    password: false
