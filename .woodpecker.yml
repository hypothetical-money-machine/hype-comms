when:
  - event: push
    branch: main
  - event: manual

variables:
  app: &app hype-comms
  registry: &registry registry.fastnfree.dev
  project: &project homelab

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hype_comms
      POSTGRES_PASSWORD: hype-comms-test-password
      POSTGRES_DB: hype_comms_test
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und-x-icu

steps:
  - name: check
    image: node:24.18.0-bookworm
    commands:
      - npm ci
      - npm run check
      - HYPE_COMMS_TEST_DATABASE_URL=postgres://hype_comms:hype-comms-test-password@postgres:5432/hype_comms_test npm run test:postgres

  - name: build-push
    image: gcr.io/kaniko-project/executor:v1.23.2-debug@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    environment:
      DOCKER_CONFIG: /kaniko/.docker
      HARBOR_USER:
        from_secret: harbor_ci_user
      HARBOR_PASS:
        from_secret: harbor_ci_token
      APP: *app
      REGISTRY: *registry
      PROJECT: *project
    commands:
      # Public DNS routes through Cloudflare, which does not expose Harbor's /v2/ API. The
      # Woodpecker agent reaches the same registry through the ops-cluster MetalLB address.
      - echo "192.168.1.60 registry.fastnfree.dev" >> /etc/hosts
      - mkdir -p /kaniko/.docker
      - |
        set +x
        cat > /kaniko/.docker/config.json <<EOF
        {"auths":{"$${REGISTRY}":{"username":"$${HARBOR_USER}","password":"$${HARBOR_PASS}"}}}
        EOF
        set -x
      - |
        /kaniko/executor \
          --context=dir://$${CI_WORKSPACE} \
          --dockerfile=Dockerfile \
          --destination=$${REGISTRY}/$${PROJECT}/$${APP}:$${CI_COMMIT_SHA} \
          --custom-platform=linux/amd64 \
          --label=org.opencontainers.image.revision=$${CI_COMMIT_SHA} \
          --label=org.opencontainers.image.source=https://github.com/hypothetical-money-machine/hype-comms \
          --image-name-tag-with-digest-file=/tmp/image-reference \
          --reproducible \
          --cache=true \
          --cache-repo=$${REGISTRY}/$${PROJECT}/cache
      - cat /tmp/image-reference
    depends_on:
      - check
    when:
      - event: push
        branch: main
      - event: manual
        branch: main
