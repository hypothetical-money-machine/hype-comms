# PostgreSQL-backed deployment for the authenticated chat server.
#
# Copy .env.example to .env and set every required value before starting.
#
#   docker compose up --build -d
#
# The published port is bound to loopback so the service is reachable only by a reverse proxy or
# tunnel running on the same host, never directly from the LAN.

services:
  server:
    build:
      context: .
      target: runtime
    image: hype-comms-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HYPE_COMMS_BIND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${HYPE_COMMS_NODE_ENV:-production}
      HYPE_COMMS_HOST: 0.0.0.0
      HYPE_COMMS_PORT: "3000"
      HYPE_COMMS_LOG_LEVEL: ${HYPE_COMMS_LOG_LEVEL:-info}
      # The public URL is what users reach through the tunnel. It must be HTTPS in production and
      # it also decides whether session cookies carry the Secure attribute.
      HYPE_COMMS_PUBLIC_API_URL: ${HYPE_COMMS_PUBLIC_API_URL:-https://chat-api.example.invalid}
      # The desktop client's renderer origins, not the API hostname. The websocket route
      # rejects any Origin not listed here.
      HYPE_COMMS_ALLOWED_ORIGINS: ${HYPE_COMMS_ALLOWED_ORIGINS:-app://bundle,http://127.0.0.1:5173}
      # Trust forwarded client addresses only from Docker-private peers. Override this with the
      # narrow IP/CIDR used by your reverse proxy when Docker uses a different network range.
      HYPE_COMMS_TRUSTED_PROXIES: ${HYPE_COMMS_TRUSTED_PROXIES:-172.16.0.0/12}
      HYPE_COMMS_ANNOUNCEMENT_CHANNELS_ENABLED: ${HYPE_COMMS_ANNOUNCEMENT_CHANNELS_ENABLED:-false}
      HYPE_COMMS_AUTHKIT_ADMISSION_ENABLED: ${HYPE_COMMS_AUTHKIT_ADMISSION_ENABLED:-false}
      HYPE_COMMS_DATABASE_URL: ${HYPE_COMMS_DATABASE_URL:?set HYPE_COMMS_DATABASE_URL in .env}
      HYPE_COMMS_DATABASE_POOL_SIZE: ${HYPE_COMMS_DATABASE_POOL_SIZE:-10}
      HYPE_COMMS_EMAIL_DELIVERY: ${HYPE_COMMS_EMAIL_DELIVERY:-manual}
      HYPE_COMMS_AGENT_PROVISIONING_ENABLED: ${HYPE_COMMS_AGENT_PROVISIONING_ENABLED:-false}
      HYPE_COMMS_SMTP_URL: ${HYPE_COMMS_SMTP_URL:-}
      HYPE_COMMS_EMAIL_FROM: ${HYPE_COMMS_EMAIL_FROM:-}
      HYPE_COMMS_OWNER_EMAIL: ${HYPE_COMMS_OWNER_EMAIL:-}
      HYPE_COMMS_WORKSPACE_NAME: ${HYPE_COMMS_WORKSPACE_NAME:-Hype Comms}
      HYPE_COMMS_WORKSPACE_SLUG: ${HYPE_COMMS_WORKSPACE_SLUG:-hype-comms}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      WORKOS_JWT_ISSUER: ${WORKOS_JWT_ISSUER:-}
      HYPE_COMMS_AUTH_ENCRYPTION_KEY: ${HYPE_COMMS_AUTH_ENCRYPTION_KEY:-}
      WORKOS_WEBHOOK_SECRET: ${WORKOS_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hype_comms
      POSTGRES_PASSWORD: ${HYPE_COMMS_POSTGRES_PASSWORD:?set HYPE_COMMS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hype_comms
      # Deterministic collation so index ordering cannot shift under a base-image upgrade.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hype_comms -d hype_comms"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # Loopback publication supports host-side migrations and integration tests without making the
    # database reachable from the LAN.
    ports:
      - "127.0.0.1:${HYPE_COMMS_POSTGRES_BIND_PORT:-5432}:5432"

volumes:
  postgres-data:
