# PostgreSQL-backed deployment for the authenticated chat server.
#
# Copy .env.example to .env and set every required value before starting.
#
#   docker compose up --build -d
#
# The published port is bound to loopback so the service is reachable only by a reverse proxy or
# tunnel running on the same host, never directly from the LAN.

services:
  server:
    build:
      context: .
      target: runtime
    image: hmm-chat-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HMM_BIND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${HMM_NODE_ENV:-production}
      HMM_HOST: 0.0.0.0
      HMM_PORT: "3000"
      HMM_LOG_LEVEL: ${HMM_LOG_LEVEL:-info}
      # The public URL is what users reach through the tunnel. It must be HTTPS in production and
      # it also decides whether session cookies carry the Secure attribute.
      HMM_PUBLIC_API_URL: ${HMM_PUBLIC_API_URL:-https://chat-api.example.invalid}
      # The desktop client's renderer origins, not the API hostname. The websocket route
      # rejects any Origin not listed here.
      HMM_ALLOWED_ORIGINS: ${HMM_ALLOWED_ORIGINS:-app://bundle,http://127.0.0.1:5173}
      HMM_DATABASE_URL: ${HMM_DATABASE_URL:?set HMM_DATABASE_URL in .env}
      HMM_DATABASE_POOL_SIZE: ${HMM_DATABASE_POOL_SIZE:-10}
      HMM_EMAIL_DELIVERY: ${HMM_EMAIL_DELIVERY:-manual}
      HMM_AGENT_PROVISIONING_ENABLED: ${HMM_AGENT_PROVISIONING_ENABLED:-false}
      HMM_SMTP_URL: ${HMM_SMTP_URL:-}
      HMM_EMAIL_FROM: ${HMM_EMAIL_FROM:-}
      HMM_OWNER_EMAIL: ${HMM_OWNER_EMAIL:-}
      HMM_WORKSPACE_NAME: ${HMM_WORKSPACE_NAME:-Hype Comms}
      HMM_WORKSPACE_SLUG: ${HMM_WORKSPACE_SLUG:-hmm-chat}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmm
      POSTGRES_PASSWORD: ${HMM_POSTGRES_PASSWORD:?set HMM_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hmm_chat
      # Deterministic collation so index ordering cannot shift under a base-image upgrade.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmm -d hmm_chat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # Loopback publication supports host-side migrations and integration tests without making the
    # database reachable from the LAN.
    ports:
      - "127.0.0.1:${HMM_POSTGRES_BIND_PORT:-5432}:5432"

volumes:
  postgres-data:
