# Single-service deployment for the chat server.
#
# Copy .env.example to .env and set HMM_CHAT_ACCESS_CODE before starting. The access code is
# required: compose refuses to start rather than falling back to an insecure default.
#
#   docker compose up --build -d
#
# The published port is bound to loopback so the service is reachable only by a reverse proxy or
# tunnel running on the same host, never directly from the LAN.

services:
  server:
    build:
      context: .
      target: runtime
    image: hmm-chat-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HMM_BIND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${HMM_NODE_ENV:-production}
      HMM_HOST: 0.0.0.0
      HMM_PORT: "3000"
      HMM_LOG_LEVEL: ${HMM_LOG_LEVEL:-info}
      # The public URL is what users reach through the tunnel. It must be HTTPS in production and
      # it also decides whether session cookies carry the Secure attribute.
      HMM_PUBLIC_API_URL: ${HMM_PUBLIC_API_URL:-https://chat.hypemm.com}
      HMM_ALLOWED_ORIGINS: ${HMM_ALLOWED_ORIGINS:-https://chat.hypemm.com}
      HMM_CHAT_ENABLED: "true"
      HMM_CHAT_ACCESS_CODE: ${HMM_CHAT_ACCESS_CODE:?set HMM_CHAT_ACCESS_CODE in .env}
      HMM_CHAT_DATA_PATH: /data/hmm-chat.sqlite
      # Identity storage. Empty by default: the M1 identity model is still being built and the
      # server registers those features only when this is set. Set it in .env and start Postgres
      # with `docker compose --profile identity up -d` once identity routes exist.
      HMM_DATABASE_URL: ${HMM_DATABASE_URL:-}
    volumes:
      - chat-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Not started by a plain `docker compose up`. Bring it up with:
  #   docker compose --profile identity up -d
  postgres:
    image: postgres:18-alpine
    profiles: ["identity"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmm
      # Compose interpolates variables for inactive profiles too, so this cannot be marked
      # required without breaking a plain `docker compose up`. An empty value is safe: the
      # Postgres image refuses to initialize without a password rather than starting open.
      POSTGRES_PASSWORD: ${HMM_POSTGRES_PASSWORD:-}
      POSTGRES_DB: hmm_chat
      # Deterministic collation so index ordering cannot shift under a base-image upgrade.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmm -d hmm_chat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # Not published: only the server reaches Postgres, over the compose network.

volumes:
  chat-data:
  postgres-data:
