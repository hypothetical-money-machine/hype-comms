name: Desktop package smoke

on:
  workflow_dispatch:
    inputs:
      native_notification_evidence:
        description: Capture signed, installed macOS notification and click evidence
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - packages/api-client/**
      - tsconfig*.json
      - scripts/desktop-release.mjs
      - scripts/desktop-release-validation.mjs
      - scripts/macos-signing.mjs
      - scripts/verify-zod-alignment.mjs
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - scripts/verify-desktop-package.mjs
      - scripts/require-windows-signing-env.mjs
      - scripts/verify-windows-release.mjs
      - scripts/build-macos-notification-authorization.mjs
      - scripts/capture-macos-native-notification.mjs
      - scripts/capture-macos-native-notification.test.mjs
      - scripts/macos-native-notification-evidence-helper.swift
      - scripts/verify-vite-stack.mjs
      - scripts/verify-vite-stack.test.mjs
      - .github/dependabot.yml
      - .github/workflows/desktop-release.yml
      - .github/workflows/desktop-package-smoke.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - packages/api-client/**
      - tsconfig*.json
      - scripts/desktop-release.mjs
      - scripts/desktop-release-validation.mjs
      - scripts/macos-signing.mjs
      - scripts/verify-zod-alignment.mjs
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - scripts/verify-desktop-package.mjs
      - scripts/require-windows-signing-env.mjs
      - scripts/verify-windows-release.mjs
      - scripts/build-macos-notification-authorization.mjs
      - scripts/capture-macos-native-notification.mjs
      - scripts/capture-macos-native-notification.test.mjs
      - scripts/macos-native-notification-evidence-helper.swift
      - scripts/verify-vite-stack.mjs
      - scripts/verify-vite-stack.test.mjs
      - .github/dependabot.yml
      - .github/workflows/desktop-release.yml
      - .github/workflows/desktop-package-smoke.yml
  merge_group:
    types: [checks_requested]

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            # Routine smoke uses disposable hosted runners. Manual dispatch retains native host
            # coverage without exposing persistent release hosts to pull-request code.
            runner: ${{ github.event_name == 'workflow_dispatch' && '["self-hosted", "macOS", "ARM64", "notarize"]' || '["macos-15"]' }}
            self_hosted: ${{ github.event_name == 'workflow_dispatch' }}
            native_notifications_enabled: "1"
            cache_paths: |
              ~/.npm
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - platform: Windows
            runner: ${{ github.event_name == 'workflow_dispatch' && '["self-hosted", "Windows", "ARM64", "windows-release"]' || '["windows-11-arm"]' }}
            self_hosted: ${{ github.event_name == 'workflow_dispatch' }}
            native_notifications_enabled: "0"
            cache_paths: |
              ~/.npm
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - platform: Linux
            runner: ${{ github.event_name == 'workflow_dispatch' && '["self-hosted", "Linux", "ARM64", "hype-comms-release", "docker"]' || '["ubuntu-24.04-arm"]' }}
            self_hosted: ${{ github.event_name == 'workflow_dispatch' }}
            native_notifications_enabled: "0"
            cache_paths: |
              ~/.npm
              ~/.cache/electron
              ~/.cache/electron-builder
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HYPE_COMMS_NATIVE_NOTIFICATIONS_ENABLED: ${{ matrix.native_notifications_enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Cache downloads only, and rebuild node_modules and the application from source. Trusted
      # pushes to main keep these caches warm for the desktop release workflow, which restores
      # them under the same key without saving.
      - name: Restore desktop dependency downloads
        if: ${{ !matrix.self_hosted }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache_paths }}
          key: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            desktop-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify native Linux ARM64 runner
        if: matrix.platform == 'Linux' && matrix.self_hosted
        shell: sh
        run: |
          test "$(uname -m)" = "aarch64"
          test "$(node -p 'process.arch')" = "arm64"

      # This runner uses the official ARM64 MinGit archive, which ships sh.exe but not bash.exe.
      # Its PowerShell execution policy also rejects the generated scripts used by Actions.
      - name: Expose MinGit sh on Windows
        if: matrix.platform == 'Windows' && matrix.self_hosted
        shell: cmd
        run: |
          if not exist "C:\Actions\tools\mingit\usr\bin\sh.exe" exit /b 1
          if not exist "%WINDIR%\System32\vcruntime140.dll" echo The Microsoft Visual C++ 2015-2022 ARM64 runtime is required on the Windows runner.
          if not exist "%WINDIR%\System32\vcruntime140.dll" exit /b 1
          echo C:\Actions\tools\mingit\usr\bin>>"%GITHUB_PATH%"

      - name: Install dependencies
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm ci --no-audit --prefer-offline

      # MinGit omits bash.exe, but Windows npm's extensionless shim requires it. Invoke npm.cmd
      # through cmd.exe so this lane also avoids the VM's generated-PowerShell policy.
      - name: Install dependencies on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm ci --no-audit --prefer-offline

      - name: Package DEV desktop application
        if: matrix.platform != 'Windows'
        env:
          # electron-builder skips all macOS signing in PR jobs before reading identity: "-"
          # unless this is enabled. Hosted jobs receive no signing secrets, and identity discovery
          # remains disabled for every DEV smoke build.
          CSC_FOR_PULL_REQUEST: ${{ matrix.platform == 'macOS' && !matrix.self_hosted && 'true' || 'false' }}
        shell: sh
        run: npm run package:desktop

      - name: Package DEV desktop application on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm run package:desktop

      - name: Verify packaged application contents, updater, and fuses
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm run verify:desktop-package

      - name: Verify packaged application contents, updater, and fuses on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm run verify:desktop-package

      # Keep the default DEV smoke above while checking the released identity and updater feed
      # before a tag. Linux is sufficient for the shared package metadata/feed gate and avoids
      # invoking production macOS signing or duplicating the full native matrix.
      - name: Package production desktop application on Linux
        if: matrix.platform == 'Linux'
        env:
          HYPE_COMMS_BUILD_FLAVOR: production
          HYPE_COMMS_API_ORIGIN: https://chat-api.hypemm.com
        shell: sh
        run: npm run package:desktop:linux

      - name: Verify production desktop package on Linux
        if: matrix.platform == 'Linux'
        env:
          HYPE_COMMS_BUILD_FLAVOR: production
          HYPE_COMMS_API_ORIGIN: https://chat-api.hypemm.com
        shell: sh
        run: npm run verify:desktop-package

  macos-native-notification-evidence:
    name: Build signed macOS evidence package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.native_notification_evidence
    runs-on: [self-hosted, macOS, ARM64, notarize]
    environment: release
    timeout-minutes: 60
    env:
      HYPE_COMMS_BUILD_FLAVOR: production
      HYPE_COMMS_API_ORIGIN: https://chat-api.hypemm.com
      HYPE_COMMS_NATIVE_NOTIFICATIONS_ENABLED: "1"
      HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_ENABLED: ${{ inputs.native_notification_evidence && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        shell: sh
        run: npm ci --no-audit --prefer-offline

      - name: Configure macOS signing and notarization
        shell: bash
        env:
          HYPE_COMMS_MACOS_CSC_LINK: ${{ secrets.HYPE_COMMS_MACOS_CSC_LINK }}
          HYPE_COMMS_MACOS_CSC_KEY_PASSWORD: ${{ secrets.HYPE_COMMS_MACOS_CSC_KEY_PASSWORD }}
          HYPE_COMMS_MACOS_APPLE_API_KEY_BASE64: ${{ secrets.HYPE_COMMS_MACOS_APPLE_API_KEY_BASE64 }}
          HYPE_COMMS_MACOS_APPLE_API_KEY_ID: ${{ secrets.HYPE_COMMS_MACOS_APPLE_API_KEY_ID }}
          HYPE_COMMS_MACOS_APPLE_API_ISSUER: ${{ secrets.HYPE_COMMS_MACOS_APPLE_API_ISSUER }}
          EXPECTED_MACOS_TEAM_ID: 5LTMYWRTYR
        run: node scripts/desktop-release.mjs configure-macos-signing

      - name: Build signed macOS capture helper
        if: inputs.native_notification_evidence
        shell: bash
        run: |
          helper_bundle="${RUNNER_TEMP}/Hype Comms Evidence.app"
          helper_executable="${helper_bundle}/Contents/MacOS/hmm-native-notification-evidence"
          mkdir -p "${helper_bundle}/Contents/MacOS"
          /usr/bin/xcrun swiftc \
            -parse-as-library \
            -O \
            -framework AppKit \
            -framework ApplicationServices \
            -framework CoreGraphics \
            -framework Foundation \
            -framework ImageIO \
            -framework ScreenCaptureKit \
            -framework UniformTypeIdentifiers \
            scripts/macos-native-notification-evidence-helper.swift \
            -o "$helper_executable"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string hmm-native-notification-evidence' \
            -c 'Add :CFBundleIdentifier string com.hypotheticalmoneymachine.hmmchat.notification-evidence' \
            -c 'Add :CFBundleName string Hype Comms Evidence' \
            -c 'Add :CFBundlePackageType string APPL' \
            -c 'Add :CFBundleShortVersionString string 1' \
            -c 'Add :CFBundleVersion string 1' \
            -c 'Add :LSUIElement bool true' \
            -c 'Add :NSScreenCaptureUsageDescription string Capture synthetic Hype Comms notification evidence.' \
            "${helper_bundle}/Contents/Info.plist"
          /usr/bin/codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$CSC_NAME" \
            --keychain "$CSC_KEYCHAIN" \
            "$helper_bundle"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$helper_bundle"

          echo "HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_HELPER=${helper_bundle}" >> "$GITHUB_ENV"

      - name: Package signed and notarized macOS application
        shell: sh
        run: npm run package:desktop:mac:arm64

      - name: Verify packaged application contents, updater, and fuses
        shell: sh
        run: npm run verify:desktop-package

      - name: Verify macOS release signing and notarization
        shell: bash
        run: npm run verify:desktop-package:macos-release

      - name: Await unlocked console and authorize macOS capture helper
        if: inputs.native_notification_evidence
        shell: bash
        run: |
          helper_bundle="$HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_HELPER"
          helper_executable="${helper_bundle}/Contents/MacOS/hmm-native-notification-evidence"
          unlock_deadline=$((SECONDS + 900))
          while true; do
            console_state="$(/usr/sbin/ioreg -n Root -d 1)"
            if [[ ! "$console_state" =~ \"CGSSessionScreenIsLocked\"[[:space:]]*=[[:space:]]*Yes &&
                  ! "$console_state" =~ \"IOConsoleLocked\"[[:space:]]*=[[:space:]]*Yes ]]; then
              break
            fi
            if (( SECONDS >= unlock_deadline )); then
              echo "The macOS console remained locked; unlock it and rerun this workflow." >&2
              exit 1
            fi
            echo "Waiting for the macOS console to be unlocked before GUI evidence capture."
            sleep 5
          done

          /usr/bin/open -W -n "$helper_bundle" --args request &
          helper_request_pid=$!
          permission_deadline=$((SECONDS + 300))
          until "$helper_executable" preflight; do
            if [[ -n "$helper_request_pid" ]] &&
              ! kill -0 "$helper_request_pid" 2>/dev/null; then
              wait "$helper_request_pid" || true
              helper_request_pid=""
            fi
            if (( SECONDS >= permission_deadline )); then
              if [[ -n "$helper_request_pid" ]]; then
                kill "$helper_request_pid" 2>/dev/null || true
                wait "$helper_request_pid" 2>/dev/null || true
              fi
              echo "Grant Screen Recording and Accessibility to Hype Comms Evidence, then rerun this workflow." >&2
              exit 1
            fi
            sleep 2
          done
          if [[ -n "$helper_request_pid" ]]; then
            wait "$helper_request_pid" || true
          fi

      - name: Capture installed notification and click callback
        if: inputs.native_notification_evidence
        shell: bash
        run: |
          evidence_directory="${RUNNER_TEMP}/hmm-macos-native-notification-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install_directory="${RUNNER_TEMP}/hmm-macos-native-notification-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$evidence_directory"
          mkdir -m 700 "$install_directory"
          shopt -s nullglob
          source_bundles=("${GITHUB_WORKSPACE}/apps/desktop/release/mac-arm64/"*.app)
          if [[ "${#source_bundles[@]}" -ne 1 || ! -d "${source_bundles[0]}" ]]; then
            echo "Expected exactly one packaged ARM64 macOS application bundle." >&2
            exit 1
          fi
          /usr/bin/ditto \
            "${source_bundles[0]}" \
            "${install_directory}/Hype Comms.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${install_directory}/Hype Comms.app"
          echo "HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY=${evidence_directory}" >> "$GITHUB_ENV"
          : > "${evidence_directory}/automation.log"
          chmod 600 "${evidence_directory}/automation.log"
          set -o pipefail
          node scripts/capture-macos-native-notification.mjs \
            --app="${install_directory}/Hype Comms.app" \
            --helper="$HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_HELPER" \
            --artifacts="$evidence_directory" 2>&1 | tee -a "${evidence_directory}/automation.log"

      - name: Upload macOS notification evidence
        if: always() && env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-notification-evidence
          path: |
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/automation.log
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/application.log
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/delivered.json
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/clicked.json
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/failed.json
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/macos-native-notification.png
            ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}/macos-native-notification-clicked.png
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary macOS signing keychain
        if: always()
        shell: bash
        run: node scripts/desktop-release.mjs cleanup-macos-signing
