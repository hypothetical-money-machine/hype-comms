name: Desktop package smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - scripts/verify-desktop-package.mjs
      - .github/workflows/desktop-package-smoke.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - scripts/verify-desktop-package.mjs
      - .github/workflows/desktop-package-smoke.yml

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package unsigned smoke artifact
        run: npm run package:desktop

      - name: Verify packaged application contents and fuses
        run: npm run verify:desktop-package

      # Only the distributable installers. `release/*` also matches the unpacked application
      # directories, which uploaded ~1,500 files and over a gigabyte per macOS run and exhausted
      # the artifact storage quota. Packaging is verified by the step above; these uploads exist
      # only so a reviewer can try a branch build, so they expire quickly.
      # Convenience only, so it must not gate the job. Packaging correctness is asserted by
      # verify:desktop-package above; a storage quota problem is not a packaging regression.
      - name: Upload package smoke artifact
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hmm-chat-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 2
