name: Desktop package smoke

on:
  workflow_dispatch:
    inputs:
      native_notification_evidence:
        description: Capture signed, installed macOS notification and click evidence
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - scripts/verify-desktop-package.mjs
      - scripts/capture-macos-native-notification.mjs
      - scripts/capture-macos-native-notification.test.mjs
      - scripts/verify-vite-stack.mjs
      - scripts/verify-vite-stack.test.mjs
      - .github/dependabot.yml
      - .github/workflows/desktop-release.yml
      - .github/workflows/desktop-package-smoke.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/contracts/**
      - package.json
      - package-lock.json
      - .node-version
      - .npmrc
      - scripts/verify-desktop-package.mjs
      - scripts/capture-macos-native-notification.mjs
      - scripts/capture-macos-native-notification.test.mjs
      - scripts/verify-vite-stack.mjs
      - scripts/verify-vite-stack.test.mjs
      - .github/dependabot.yml
      - .github/workflows/desktop-release.yml
      - .github/workflows/desktop-package-smoke.yml

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.platform }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: '["self-hosted", "macOS", "ARM64", "notarize"]'
            native_notifications_enabled: "1"
          - platform: Windows
            runner: '["self-hosted", "Windows", "ARM64", "windows-release"]'
            native_notifications_enabled: "0"
          - platform: Linux
            # Smoke packages do not need release credentials. Run the Linux lane on the native
            # ARM64 runner so package tooling is exercised on the architecture it targets.
            runner: '["self-hosted", "Linux", "ARM64", "hype-comms-release", "docker"]'
            native_notifications_enabled: "0"
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HYPE_COMMS_NATIVE_NOTIFICATIONS_ENABLED: ${{ matrix.native_notifications_enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify native Linux ARM64 runner
        if: matrix.platform == 'Linux'
        shell: sh
        run: |
          test "$(uname -m)" = "aarch64"
          test "$(node -p 'process.arch')" = "arm64"

      # This runner uses the official ARM64 MinGit archive, which ships sh.exe but not bash.exe.
      # Its PowerShell execution policy also rejects the generated scripts used by Actions.
      - name: Expose MinGit sh on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Actions\tools\mingit\usr\bin\sh.exe" exit /b 1
          if not exist "%WINDIR%\System32\vcruntime140.dll" echo The Microsoft Visual C++ 2015-2022 ARM64 runtime is required on the Windows runner.
          if not exist "%WINDIR%\System32\vcruntime140.dll" exit /b 1
          echo C:\Actions\tools\mingit\usr\bin>>"%GITHUB_PATH%"

      - name: Install dependencies
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm ci

      # MinGit omits bash.exe, but Windows npm's extensionless shim requires it. Invoke npm.cmd
      # through cmd.exe so this lane also avoids the VM's generated-PowerShell policy.
      - name: Install dependencies on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm ci

      - name: Package unsigned desktop application
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm run package:desktop

      - name: Package unsigned desktop application on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm run package:desktop

      - name: Verify packaged application contents, updater, and fuses
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm run verify:desktop-package

      - name: Verify packaged application contents, updater, and fuses on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm run verify:desktop-package

  macos-native-notification-evidence:
    name: Capture signed macOS native notification evidence
    if: github.event_name == 'workflow_dispatch' && inputs.native_notification_evidence
    runs-on: [self-hosted, macOS, ARM64, notarize]
    timeout-minutes: 60
    env:
      HYPE_COMMS_NATIVE_NOTIFICATIONS_ENABLED: "1"
      HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        shell: sh
        run: npm ci

      - name: Configure macOS signing and notarization
        shell: bash
        env:
          HMM_MACOS_CSC_LINK: ${{ secrets.HMM_MACOS_CSC_LINK }}
          HMM_MACOS_CSC_KEY_PASSWORD: ${{ secrets.HMM_MACOS_CSC_KEY_PASSWORD }}
          HMM_MACOS_APPLE_API_KEY_BASE64: ${{ secrets.HMM_MACOS_APPLE_API_KEY_BASE64 }}
          HMM_MACOS_APPLE_API_KEY_ID: ${{ secrets.HMM_MACOS_APPLE_API_KEY_ID }}
          HMM_MACOS_APPLE_API_ISSUER: ${{ secrets.HMM_MACOS_APPLE_API_ISSUER }}
          EXPECTED_MACOS_TEAM_ID: 5LTMYWRTYR
        run: |
          if [[ -z "$HMM_MACOS_CSC_LINK" ||
                -z "$HMM_MACOS_CSC_KEY_PASSWORD" ||
                -z "$HMM_MACOS_APPLE_API_KEY_BASE64" ||
                -z "$HMM_MACOS_APPLE_API_KEY_ID" ||
                -z "$HMM_MACOS_APPLE_API_ISSUER" ]]; then
            echo "The macOS evidence build requires signing and all notarization secrets." >&2
            exit 1
          fi

          umask 077
          certificate_path="${RUNNER_TEMP}/hmm-chat-signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/hmm-chat-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          original_keychains_path="${RUNNER_TEMP}/hmm-chat-original-keychains.txt"
          original_keychains_pending_path="${original_keychains_path}.pending"
          root_certs_keychain="${GITHUB_WORKSPACE}/node_modules/app-builder-lib/certs/root_certs.keychain"
          api_key_path="${RUNNER_TEMP}/hmm-chat-notary-api-key.p8"

          printf '%s' "${HMM_MACOS_CSC_LINK#base64:}" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$HMM_MACOS_APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"

          security delete-keychain "$keychain_path" 2>/dev/null || rm -f "$keychain_path"
          rm -f "$original_keychains_path" "$original_keychains_pending_path"
          security list-keychains -d user > "$original_keychains_pending_path"
          mv "$original_keychains_pending_path" "$original_keychains_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$HMM_MACOS_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          additional_keychains=()
          parsed_keychain_count=0
          unparsed_keychain_count=0
          while IFS= read -r item; do
            if [[ "$item" =~ \"(.*)\" ]]; then
              keychain="${BASH_REMATCH[1]}"
              parsed_keychain_count=$((parsed_keychain_count + 1))
              if [[ "$keychain" != "$keychain_path" &&
                    "$keychain" != "$root_certs_keychain" ]]; then
                additional_keychains+=("$keychain")
              fi
            elif [[ "$item" == *[![:space:]]* ]]; then
              unparsed_keychain_count=$((unparsed_keychain_count + 1))
            fi
          done < "$original_keychains_path"
          if [[ "$unparsed_keychain_count" -ne 0 ||
                ( -s "$original_keychains_path" && "$parsed_keychain_count" -eq 0 ) ]]; then
            echo "Could not parse the original macOS keychain search list." >&2
            exit 1
          fi
          security list-keychains -d user -s \
            "$keychain_path" \
            "$root_certs_keychain" \
            "${additional_keychains[@]}"

          signing_identities="$(security find-identity -v -p codesigning "$keychain_path")"
          identity_regex="^[[:space:]]*[0-9]+\\)[[:space:]]+([[:xdigit:]]{40})[[:space:]]+\"Developer ID Application: .+ \\(${EXPECTED_MACOS_TEAM_ID}\\)\"$"
          expected_identity_hashes=()
          while IFS= read -r item; do
            if [[ "$item" =~ $identity_regex ]]; then
              expected_identity_hashes+=("${BASH_REMATCH[1]}")
            fi
          done <<< "$signing_identities"
          if [[ "${#expected_identity_hashes[@]}" -ne 1 ]]; then
            echo "The signing keychain must contain exactly one ${EXPECTED_MACOS_TEAM_ID} Developer ID Application identity." >&2
            printf '%s\n' "$signing_identities" >&2
            exit 1
          fi

          {
            echo "CSC_KEYCHAIN=${keychain_path}"
            echo "CSC_NAME=${expected_identity_hashes[0]}"
            echo "APPLE_API_KEY=${api_key_path}"
            echo "APPLE_API_KEY_ID=${HMM_MACOS_APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${HMM_MACOS_APPLE_API_ISSUER}"
          } >> "$GITHUB_ENV"

      - name: Package signed and notarized macOS application
        shell: sh
        run: npm run package:desktop:mac

      - name: Verify macOS release signing and notarization
        shell: bash
        run: npm run verify:desktop-package:macos-release

      - name: Capture installed notification and click callback
        shell: bash
        run: |
          evidence_directory="${RUNNER_TEMP}/hmm-macos-native-notification-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install_directory="${RUNNER_TEMP}/hmm-macos-native-notification-install-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$evidence_directory"
          mkdir -m 700 "$install_directory"
          /usr/bin/ditto \
            "${GITHUB_WORKSPACE}/apps/desktop/release/mac-arm64/hype-comms.app" \
            "${install_directory}/Hype Comms.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${install_directory}/Hype Comms.app"
          echo "HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY=${evidence_directory}" >> "$GITHUB_ENV"
          node scripts/capture-macos-native-notification.mjs \
            --app="${install_directory}/Hype Comms.app" \
            --artifacts="$evidence_directory"

      - name: Upload macOS notification evidence
        if: always() && env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-notification-evidence
          path: ${{ env.HYPE_COMMS_MACOS_NATIVE_NOTIFICATION_EVIDENCE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary macOS signing keychain
        if: always()
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/hmm-chat-signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/hmm-chat-signing.keychain-db"
          original_keychains_path="${RUNNER_TEMP}/hmm-chat-original-keychains.txt"
          original_keychains_pending_path="${original_keychains_path}.pending"
          api_key_path="${RUNNER_TEMP}/hmm-chat-notary-api-key.p8"
          cleanup_status=0
          set +e
          if [[ -f "$original_keychains_path" ]]; then
            original_keychains=()
            parsed_keychain_count=0
            unparsed_keychain_count=0
            while IFS= read -r item; do
              if [[ "$item" =~ \"(.*)\" ]]; then
                keychain="${BASH_REMATCH[1]}"
                parsed_keychain_count=$((parsed_keychain_count + 1))
                if [[ "$keychain" != "$keychain_path" ]]; then
                  original_keychains+=("$keychain")
                fi
              elif [[ "$item" == *[![:space:]]* ]]; then
                unparsed_keychain_count=$((unparsed_keychain_count + 1))
              fi
            done < "$original_keychains_path"
            if [[ "$unparsed_keychain_count" -ne 0 ||
                  ( -s "$original_keychains_path" && "$parsed_keychain_count" -eq 0 ) ]]; then
              echo "Could not parse the original macOS keychain search list." >&2
              cleanup_status=1
            elif ! security list-keychains -d user -s "${original_keychains[@]}"; then
              cleanup_status=1
            fi
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f \
            "$certificate_path" \
            "$keychain_path" \
            "$original_keychains_pending_path" \
            "$api_key_path" || cleanup_status=1
          if [[ "$cleanup_status" -eq 0 ]]; then
            rm -f "$original_keychains_path" || cleanup_status=1
          else
            echo "Preserving ${original_keychains_path} for manual keychain-list recovery." >&2
          fi
          exit "$cleanup_status"
