name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check with PostgreSQL
    # GitHub-hosted jobs are unavailable on the repository's current billing plan. Keep untrusted
    # fork code off persistent infrastructure; this organization runner group is restricted to
    # private same-repository branches controlled by collaborators.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: hmm-linux-x64-ci
      labels: hmm-ci
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify PostgreSQL 16 runner image
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            echo "PostgreSQL 16 is missing; rebuild the linux-x64 runner image." >&2
            exit 1
          fi

      - name: Start isolated PostgreSQL
        id: postgres
        run: |
          postgres_bindir=/usr/lib/postgresql/16/bin
          postgres_data="$RUNNER_TEMP/pgdata"
          postgres_password_file="$RUNNER_TEMP/postgres-password"
          printf '%s' 'hype-comms-test-password' > "$postgres_password_file"
          "$postgres_bindir/initdb" \
            --pgdata="$postgres_data" \
            --username=hype_comms \
            --pwfile="$postgres_password_file" \
            --auth-host=scram-sha-256 \
            --auth-local=trust \
            --encoding=UTF8 \
            --locale=C.UTF-8 \
            --no-instructions
          printf "%s\n" \
            "listen_addresses = '127.0.0.1'" \
            "port = 55432" \
            "unix_socket_directories = '$RUNNER_TEMP'" >> "$postgres_data/postgresql.conf"
          "$postgres_bindir/pg_ctl" \
            --pgdata="$postgres_data" \
            --log="$RUNNER_TEMP/postgres.log" \
            --wait start
          PGPASSWORD=hype-comms-test-password "$postgres_bindir/createdb" \
            --host=127.0.0.1 \
            --port=55432 \
            --username=hype_comms \
            --owner=hype_comms \
            hype_comms_test
          echo "connection-uri=postgresql://hype_comms:hype-comms-test-password@127.0.0.1:55432/hype_comms_test" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types, tests, and production builds
        run: npm run check

      - name: Run the complete PostgreSQL suite
        env:
          HYPE_COMMS_TEST_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: npm run test:postgres

      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/pgdata/postmaster.pid" ]; then
            /usr/lib/postgresql/16/bin/pg_ctl \
              --pgdata="$RUNNER_TEMP/pgdata" \
              --wait \
              --mode=fast stop
          fi
