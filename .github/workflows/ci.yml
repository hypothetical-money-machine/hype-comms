name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check with PostgreSQL
    # Public pull requests run on disposable GitHub-hosted infrastructure. The job has a read-only
    # token, receives no repository secrets, and never schedules contributor code on release hosts.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hype_comms_test
          POSTGRES_PASSWORD: hype-comms-test-password
          POSTGRES_USER: hype_comms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hype_comms -d hype_comms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Cache downloads only, and rebuild node_modules from scratch every run. npm ci verifies
      # every tarball against the lockfile's integrity hashes, and the Electron postinstall
      # checksums its binary download.
      - name: Restore dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/electron
          key: ci-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ci-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting, types, tests, and production builds
        run: npm run check

      - name: Run the complete PostgreSQL suite
        env:
          HYPE_COMMS_TEST_DATABASE_URL: postgresql://hype_comms:hype-comms-test-password@127.0.0.1:55432/hype_comms_test
        # Bound database concurrency so the hosted runner and service remain deterministic.
        run: npm run test:postgres -- --maxWorkers 4 --testTimeout 10000
