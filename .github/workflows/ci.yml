name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check with PostgreSQL
    # GitHub-hosted jobs are unavailable on the repository's current billing plan. Keep untrusted
    # fork code off persistent infrastructure; private same-repository branches are collaborator-
    # controlled, and this read-only job receives no release credentials.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, hmm-chat-release, docker]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types, tests, and production builds
        run: npm run check

      - name: Run the complete PostgreSQL suite
        run: npm run test:db
