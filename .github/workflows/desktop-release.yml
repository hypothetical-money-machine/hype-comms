name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  # The previous key was orphaned by completed runs during the August 2026 Actions incident.
  # Keep one stable replacement key so every future desktop publication remains serialized.
  group: desktop-release-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  HYPE_COMMS_BUILD_FLAVOR: production

jobs:
  validate:
    name: Validate release version
    # This job uses only the read-only token, so it can run on the shared Lenovo CI pool.
    runs-on:
      group: hmm-linux-x64-ci
      labels: hmm-ci
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      desktop-version: ${{ steps.version.outputs.desktop-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Require a tag matching the desktop package version
        id: version
        shell: bash
        run: |
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          # Every published build must be traceable to an immutable tag. workflow_dispatch stays
          # available for re-running a release, but only against a tag ref: on a branch dispatch
          # GITHUB_REF_TYPE is "branch", which previously short-circuited this guard and would
          # have let an unreviewed branch build overwrite the pilot's update feed.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Releases publish only from a tag. Dispatch against v${desktop_version} instead of a branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${desktop_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version ${desktop_version}." >&2
            exit 1
          fi
          release_notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -L "$release_notes_path" ]] || \
            [[ ! -f "$release_notes_path" ]] || \
            ! grep -q '[^[:space:]]' "$release_notes_path"; then
            echo "Release notes must be a nonempty regular file at ${release_notes_path}." >&2
            exit 1
          fi
          if grep -Fq '<!-- release-notes:todo' "$release_notes_path"; then
            echo "Release notes at ${release_notes_path} still require review." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} is not on origin/main." >&2
            exit 1
          fi
          echo "desktop-version=${desktop_version}" >> "$GITHUB_OUTPUT"

  prepare-github-release:
    name: Prepare GitHub Release
    needs: validate
    # GitHub-hosted jobs are unavailable while organization billing is blocked. This job writes
    # GitHub Release metadata, so it stays on the isolated ARM64 release runner rather than the
    # shared Lenovo CI pool, which executes collaborator pull-request code.
    runs-on: [self-hosted, Linux, ARM64, hype-comms-release, docker]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install verified GitHub CLI
        shell: bash
        run: node scripts/install-github-cli.mjs

      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
          RELEASE_NOTES_FALLBACK_TAG: v0.1.11
        shell: bash
        run: |
          set -euo pipefail
          release_notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          release_notes="$(<"$release_notes_path")"
          release_body_path="${RUNNER_TEMP}/existing-github-release-notes.md"
          if
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq '.body // ""' > "$release_body_path" 2>/dev/null
          then
            if ! RELEASE_NOTES_PATH="$release_notes_path" \
              GITHUB_RELEASE_BODY_PATH="$release_body_path" \
              node scripts/desktop-release-notes.mjs; then
              combined_notes_path="${RUNNER_TEMP}/github-release-notes.md"
              printf '%s\n' "$release_notes" > "$combined_notes_path"
              if grep -q '[^[:space:]]' "$release_body_path"; then
                printf '\n' >> "$combined_notes_path"
                cat "$release_body_path" >> "$combined_notes_path"
              fi
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Hype Comms ${DESKTOP_VERSION}" \
                --notes-file "$combined_notes_path"
            fi
          else
            notes_start_tag="$(
              gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --exclude-drafts \
                --exclude-pre-releases \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName // empty'
            )"
            if [[ -z "$notes_start_tag" ]]; then
              notes_start_tag="$RELEASE_NOTES_FALLBACK_TAG"
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Hype Comms ${DESKTOP_VERSION}" \
              --notes-file "$release_notes_path" \
              --generate-notes \
              --notes-start-tag "$notes_start_tag"
          fi

  package:
    name: Release ${{ matrix.platform }}
    needs: [validate, prepare-github-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: '["self-hosted", "macOS", "ARM64", "notarize"]'
            artifact_os: mac
            manifest: latest-mac.yml
            package_script: package:desktop:mac
            native_notifications_enabled: "1"
          - platform: Windows
            runner: '["self-hosted", "Windows", "ARM64", "windows-release"]'
            artifact_os: win
            manifest: latest.yml
            package_script: package:desktop:win
            native_notifications_enabled: "0"
          - platform: Linux
            runner: '["self-hosted", "Linux", "ARM64", "hype-comms-release", "docker"]'
            artifact_os: linux
            manifest: latest-linux.yml
            package_script: package:desktop:linux
            native_notifications_enabled: "0"
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    env:
      # Endpoint, bucket, and region are not secret and live as repository variables. Only the
      # key pair is a secret, and it is scoped to write this one bucket.
      HYPE_COMMS_UPDATE_S3_ENDPOINT: ${{ vars.GARAGE_S3_ENDPOINT }}
      HYPE_COMMS_UPDATE_S3_BUCKET: ${{ vars.GARAGE_S3_BUCKET }}
      HYPE_COMMS_UPDATE_PUBLIC_ROOT: https://updates.hypemm.com/desktop
      # Platform pilots advance independently. macOS is signed/notarized and available behind the
      # default-off device preference; Windows and Linux remain compiled off pending their gates.
      HYPE_COMMS_NATIVE_NOTIFICATIONS_ENABLED: ${{ matrix.native_notifications_enabled }}
      UPDATE_ARTIFACT_OS: ${{ matrix.artifact_os }}
      UPDATE_MANIFEST: ${{ matrix.manifest }}
      AWS_REGION: ${{ vars.GARAGE_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.GARAGE_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # This runner uses the official ARM64 MinGit archive, which ships sh.exe but not bash.exe.
      # Its PowerShell execution policy also rejects the generated scripts used by Actions.
      - name: Expose MinGit sh on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Actions\tools\mingit\usr\bin\sh.exe" exit /b 1
          if not exist "%WINDIR%\System32\vcruntime140.dll" echo The Microsoft Visual C++ 2015-2022 ARM64 runtime is required on the Windows runner.
          if not exist "%WINDIR%\System32\vcruntime140.dll" exit /b 1
          where tar.exe >NUL 2>&1 || (echo tar.exe is required to install the pinned GitHub CLI. & exit /b 1)
          where aws.exe >NUL 2>&1 || (echo AWS CLI is required on the Windows runner. & exit /b 1)
          aws --version
          echo C:\Actions\tools\mingit\usr\bin>>"%GITHUB_PATH%"

      - name: Install verified GitHub CLI
        if: matrix.platform != 'Windows'
        shell: sh
        run: node scripts/install-github-cli.mjs

      - name: Install verified GitHub CLI on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: node scripts/install-github-cli.mjs

      - name: Install dependencies
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm ci

      # MinGit omits bash.exe, but Windows npm's extensionless shim requires it. Invoke npm.cmd
      # through cmd.exe so this lane also avoids the VM's generated-PowerShell policy.
      - name: Install dependencies on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm ci

      - name: Configure Windows Authenticode signing
        if: matrix.platform == 'Windows'
        shell: cmd
        env:
          HYPE_COMMS_WINDOWS_AZURE_TENANT_ID: ${{ secrets.HYPE_COMMS_WINDOWS_AZURE_TENANT_ID }}
          HYPE_COMMS_WINDOWS_AZURE_CLIENT_ID: ${{ secrets.HYPE_COMMS_WINDOWS_AZURE_CLIENT_ID }}
          HYPE_COMMS_WINDOWS_AZURE_CLIENT_SECRET: ${{ secrets.HYPE_COMMS_WINDOWS_AZURE_CLIENT_SECRET }}
          HYPE_COMMS_WINDOWS_AZURE_ENDPOINT: ${{ vars.HYPE_COMMS_WINDOWS_AZURE_ENDPOINT }}
          HYPE_COMMS_WINDOWS_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.HYPE_COMMS_WINDOWS_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          HYPE_COMMS_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.HYPE_COMMS_WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
          HYPE_COMMS_WINDOWS_PUBLISHER_NAME: ${{ vars.HYPE_COMMS_WINDOWS_PUBLISHER_NAME }}
        run: node scripts/require-windows-signing-env.mjs

      - name: Configure macOS signing and notarization
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          HYPE_COMMS_MACOS_CSC_LINK: ${{ secrets.HYPE_COMMS_MACOS_CSC_LINK }}
          HYPE_COMMS_MACOS_CSC_KEY_PASSWORD: ${{ secrets.HYPE_COMMS_MACOS_CSC_KEY_PASSWORD }}
          HYPE_COMMS_MACOS_APPLE_API_KEY_BASE64: ${{ secrets.HYPE_COMMS_MACOS_APPLE_API_KEY_BASE64 }}
          HYPE_COMMS_MACOS_APPLE_API_KEY_ID: ${{ secrets.HYPE_COMMS_MACOS_APPLE_API_KEY_ID }}
          HYPE_COMMS_MACOS_APPLE_API_ISSUER: ${{ secrets.HYPE_COMMS_MACOS_APPLE_API_ISSUER }}
          EXPECTED_MACOS_TEAM_ID: 5LTMYWRTYR
        run: |
          if [[ -z "$HYPE_COMMS_MACOS_CSC_LINK" ||
                -z "$HYPE_COMMS_MACOS_CSC_KEY_PASSWORD" ||
                -z "$HYPE_COMMS_MACOS_APPLE_API_KEY_BASE64" ||
                -z "$HYPE_COMMS_MACOS_APPLE_API_KEY_ID" ||
                -z "$HYPE_COMMS_MACOS_APPLE_API_ISSUER" ]]; then
            echo "The macOS release requires signing and all notarization secrets." >&2
            exit 1
          fi

          umask 077
          certificate_path="${RUNNER_TEMP}/hype-comms-signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/hype-comms-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          original_keychains_path="${RUNNER_TEMP}/hype-comms-original-keychains.txt"
          original_keychains_pending_path="${original_keychains_path}.pending"
          root_certs_keychain="${GITHUB_WORKSPACE}/node_modules/app-builder-lib/certs/root_certs.keychain"
          api_key_path="${RUNNER_TEMP}/hype-comms-notary-api-key.p8"

          # electron-builder's implicit keychain setup can pass the PKCS#12 password to
          # set-key-partition-list instead of its generated keychain password. Own the keychain
          # lifecycle here so signing works consistently on a clean self-hosted runner.
          printf '%s' "${HYPE_COMMS_MACOS_CSC_LINK#base64:}" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$HYPE_COMMS_MACOS_APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"

          security delete-keychain "$keychain_path" 2>/dev/null || rm -f "$keychain_path"
          rm -f "$original_keychains_path" "$original_keychains_pending_path"
          security list-keychains -d user > "$original_keychains_pending_path"
          mv "$original_keychains_pending_path" "$original_keychains_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$HYPE_COMMS_MACOS_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          additional_keychains=()
          parsed_keychain_count=0
          unparsed_keychain_count=0
          while IFS= read -r item; do
            if [[ "$item" =~ \"(.*)\" ]]; then
              keychain="${BASH_REMATCH[1]}"
              parsed_keychain_count=$((parsed_keychain_count + 1))
              if [[ "$keychain" != "$keychain_path" &&
                    "$keychain" != "$root_certs_keychain" ]]; then
                additional_keychains+=("$keychain")
              fi
            elif [[ "$item" == *[![:space:]]* ]]; then
              unparsed_keychain_count=$((unparsed_keychain_count + 1))
            fi
          done < "$original_keychains_path"
          if [[ "$unparsed_keychain_count" -ne 0 ||
                ( -s "$original_keychains_path" && "$parsed_keychain_count" -eq 0 ) ]]; then
            echo "Could not parse the original macOS keychain search list." >&2
            exit 1
          fi
          security list-keychains -d user -s \
            "$keychain_path" \
            "$root_certs_keychain" \
            "${additional_keychains[@]}"

          signing_identities="$(security find-identity -v -p codesigning "$keychain_path")"
          identity_regex="^[[:space:]]*[0-9]+\\)[[:space:]]+([[:xdigit:]]{40})[[:space:]]+\"Developer ID Application: .+ \\(${EXPECTED_MACOS_TEAM_ID}\\)\"$"
          expected_identity_hashes=()
          while IFS= read -r item; do
            if [[ "$item" =~ $identity_regex ]]; then
              expected_identity_hashes+=("${BASH_REMATCH[1]}")
            fi
          done <<< "$signing_identities"
          if [[ "${#expected_identity_hashes[@]}" -ne 1 ]]; then
            echo "The signing keychain must contain exactly one ${EXPECTED_MACOS_TEAM_ID} Developer ID Application identity." >&2
            printf '%s\n' "$signing_identities" >&2
            exit 1
          fi

          {
            echo "CSC_KEYCHAIN=${keychain_path}"
            echo "CSC_NAME=${expected_identity_hashes[0]}"
            echo "APPLE_API_KEY=${api_key_path}"
            echo "APPLE_API_KEY_ID=${HYPE_COMMS_MACOS_APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${HYPE_COMMS_MACOS_APPLE_API_ISSUER}"
          } >> "$GITHUB_ENV"

      - name: Package desktop application
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm run ${{ matrix.package_script }}

      - name: Package desktop application on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm run ${{ matrix.package_script }}

      - name: Verify packaged application contents, updater, and fuses
        if: matrix.platform != 'Windows'
        shell: sh
        run: npm run verify:desktop-package

      - name: Verify packaged application contents, updater, and fuses on Windows
        if: matrix.platform == 'Windows'
        shell: cmd
        run: npm run verify:desktop-package

      - name: Verify Windows release signing
        if: matrix.platform == 'Windows' && env.HYPE_COMMS_WINDOWS_SIGNING_ENABLED == 'true'
        shell: cmd
        run: npm run verify:desktop-package:windows-release

      - name: Verify macOS release signing and notarization
        if: matrix.platform == 'macOS'
        shell: bash
        run: npm run verify:desktop-package:macos-release

      # Artifact names are predictable, so a request made before upload can leave a CDN-cached
      # 404 at the bare path. The content hash gives every advertised URL a value known only after
      # packaging while the underlying object name remains stable.
      - name: Bind manifest artifact URLs to their content
        shell: sh
        run: node scripts/desktop-release.mjs cache-key-manifest

      - name: Bind Linux ARM64 manifest artifact URLs to their content
        if: matrix.platform == 'Linux'
        shell: sh
        env:
          UPDATE_MANIFEST: latest-linux-arm64.yml
        run: node scripts/desktop-release.mjs cache-key-manifest

      # Stage directly in the draft release before any update-bucket write. This avoids consuming
      # the repository's Actions artifact quota and keeps a staging failure from touching the feed.
      - name: Stage GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            apps/desktop/release/hype-comms-${{ needs.validate.outputs.desktop-version }}-${{ matrix.artifact_os }}-* \
            apps/desktop/release/latest*.yml

      # All package lanes must stage before any lane can publish its platform feed. Otherwise a
      # failed lane could leave a partial release that cannot be retried at the same tag.
      - name: Wait for all GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        shell: sh
        # Node is already pinned on every release host. Polling there avoids depending on optional
        # MinGit shell utilities such as seq and sleep on Windows.
        run: node scripts/desktop-release.mjs wait-github-assets

      - name: Address the update bucket by path
        shell: sh
        # Self-hosted S3-compatible stores are addressed by path. The helper pins AWS_CONFIG_FILE
        # under RUNNER_TEMP so every platform reuses this setting without shell-specific exports.
        run: node scripts/desktop-release.mjs configure-s3

      # Artifacts are served with a one-year immutable cache while the manifests are no-cache.
      # The platform manifest is the commit marker: an orphan artifact from a failed run was never
      # advertised to clients and may be replaced on retry, but a manifested version is immutable.
      - name: Refuse to overwrite a published platform version
        shell: sh
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: node scripts/desktop-release.mjs assert-unpublished

      # Only one manifest per lane can be the commit marker, and on Linux that is latest-linux.yml
      # below. The ARM64 manifest is published before it, so a run interrupted between the two must
      # be able to replace the ARM64 manifest on retry; refusing here would strand ARM64 clients on
      # the previous release until someone cut an entirely new version.
      - name: Refuse to roll back the published Linux ARM64 version
        if: matrix.platform == 'Linux'
        shell: sh
        env:
          ALLOW_REPUBLISH: "true"
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
          UPDATE_MANIFEST: latest-linux-arm64.yml
        run: node scripts/desktop-release.mjs assert-unpublished

      - name: Upload platform artifacts to the update bucket
        shell: sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: node scripts/desktop-release.mjs upload-artifacts

      - name: Upload the Linux ARM64 manifest before the commit marker
        if: matrix.platform == 'Linux'
        shell: sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
          UPDATE_MANIFEST: latest-linux-arm64.yml
        run: node scripts/desktop-release.mjs upload-manifest

      - name: Verify the public Linux ARM64 release
        if: matrix.platform == 'Linux'
        shell: sh
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
          UPDATE_MANIFEST: latest-linux-arm64.yml
        run: node scripts/verify-published-desktop-release.mjs

      - name: Upload the platform manifest last
        shell: sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: node scripts/desktop-release.mjs upload-manifest

      - name: Verify the public platform release
        shell: sh
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: node scripts/verify-published-desktop-release.mjs

      # The page reads the manifests at load time, so it does not go stale between releases and
      # one runner publishing it is enough.
      - name: Publish the download page
        if: matrix.platform == 'Linux'
        shell: sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
        run: node scripts/desktop-release.mjs publish-download-page

      - name: Remove temporary macOS signing keychain
        if: always() && matrix.platform == 'macOS'
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/hype-comms-signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/hype-comms-signing.keychain-db"
          original_keychains_path="${RUNNER_TEMP}/hype-comms-original-keychains.txt"
          original_keychains_pending_path="${original_keychains_path}.pending"
          api_key_path="${RUNNER_TEMP}/hype-comms-notary-api-key.p8"
          cleanup_status=0
          set +e
          if [[ -f "$original_keychains_path" ]]; then
            original_keychains=()
            parsed_keychain_count=0
            unparsed_keychain_count=0
            while IFS= read -r item; do
              if [[ "$item" =~ \"(.*)\" ]]; then
                keychain="${BASH_REMATCH[1]}"
                parsed_keychain_count=$((parsed_keychain_count + 1))
                if [[ "$keychain" != "$keychain_path" ]]; then
                  original_keychains+=("$keychain")
                fi
              elif [[ "$item" == *[![:space:]]* ]]; then
                unparsed_keychain_count=$((unparsed_keychain_count + 1))
              fi
            done < "$original_keychains_path"
            if [[ "$unparsed_keychain_count" -ne 0 ||
                  ( -s "$original_keychains_path" && "$parsed_keychain_count" -eq 0 ) ]]; then
              echo "Could not parse the original macOS keychain search list." >&2
              cleanup_status=1
            elif ! security list-keychains -d user -s "${original_keychains[@]}"; then
              cleanup_status=1
            fi
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f \
            "$certificate_path" \
            "$keychain_path" \
            "$original_keychains_pending_path" \
            "$api_key_path" || cleanup_status=1
          if [[ "$cleanup_status" -eq 0 ]]; then
            rm -f "$original_keychains_path" || cleanup_status=1
          else
            echo "Preserving ${original_keychains_path} for manual keychain-list recovery." >&2
          fi
          exit "$cleanup_status"

  github-release:
    name: Publish GitHub Release
    needs: [validate, package]
    # Publishing uses a contents:write token. Keep it off the shared Lenovo CI pool.
    runs-on: [self-hosted, Linux, ARM64, hype-comms-release, docker]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install verified GitHub CLI
        shell: bash
        run: node scripts/install-github-cli.mjs

      - name: Verify and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          release_body_path="${RUNNER_TEMP}/github-release-notes.md"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""' > "$release_body_path"
          RELEASE_NOTES_PATH="$release_notes_path" \
            GITHUB_RELEASE_BODY_PATH="$release_body_path" \
            node scripts/desktop-release-notes.mjs
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for manifest in latest-mac.yml latest.yml latest-linux.yml latest-linux-arm64.yml; do
            if ! printf '%s\n' "$assets" | grep -Fqx "$manifest"; then
              echo "GitHub Release is missing ${manifest}." >&2
              exit 1
            fi
          done
          for artifact_prefix in \
            "hype-comms-${DESKTOP_VERSION}-mac-" \
            "hype-comms-${DESKTOP_VERSION}-win-" \
            "hype-comms-${DESKTOP_VERSION}-linux-"; do
            if ! printf '%s\n' "$assets" | grep -Fq -- "$artifact_prefix"; then
              echo "GitHub Release is missing an asset with prefix ${artifact_prefix}." >&2
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hype Comms ${DESKTOP_VERSION}" \
            --draft=false \
            --latest
