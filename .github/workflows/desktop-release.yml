name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop-version: ${{ steps.version.outputs.desktop-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Require a tag matching the desktop package version
        id: version
        shell: bash
        run: |
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          # Every published build must be traceable to an immutable tag. workflow_dispatch stays
          # available for re-running a release, but only against a tag ref: on a branch dispatch
          # GITHUB_REF_TYPE is "branch", which previously short-circuited this guard and would
          # have let an unreviewed branch build overwrite the pilot's update feed.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Releases publish only from a tag. Dispatch against v${desktop_version} instead of a branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${desktop_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version ${desktop_version}." >&2
            exit 1
          fi
          echo "desktop-version=${desktop_version}" >> "$GITHUB_OUTPUT"

  package:
    name: Release on ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HMM_MACOS_CSC_LINK: ${{ secrets.HMM_MACOS_CSC_LINK }}
      HMM_MACOS_CSC_KEY_PASSWORD: ${{ secrets.HMM_MACOS_CSC_KEY_PASSWORD }}
      HMM_MACOS_APPLE_API_KEY_BASE64: ${{ secrets.HMM_MACOS_APPLE_API_KEY_BASE64 }}
      HMM_MACOS_APPLE_API_KEY_ID: ${{ secrets.HMM_MACOS_APPLE_API_KEY_ID }}
      HMM_MACOS_APPLE_API_ISSUER: ${{ secrets.HMM_MACOS_APPLE_API_ISSUER }}
      # Endpoint, bucket, and region are not secret and live as repository variables. Only the
      # key pair is a secret, and it is scoped to write this one bucket.
      HMM_UPDATE_S3_ENDPOINT: ${{ vars.GARAGE_S3_ENDPOINT }}
      HMM_UPDATE_S3_BUCKET: ${{ vars.GARAGE_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.GARAGE_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.GARAGE_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure macOS signing and optional notarization
        if: >-
          runner.os == 'macOS' &&
          env.HMM_MACOS_CSC_LINK != '' &&
          env.HMM_MACOS_CSC_KEY_PASSWORD != ''
        shell: bash
        run: |
          echo "CSC_LINK=${HMM_MACOS_CSC_LINK}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${HMM_MACOS_CSC_KEY_PASSWORD}" >> "$GITHUB_ENV"

          if [[ -n "$HMM_MACOS_APPLE_API_KEY_BASE64" &&
                -n "$HMM_MACOS_APPLE_API_KEY_ID" &&
                -n "$HMM_MACOS_APPLE_API_ISSUER" ]]; then
            umask 077
            api_key_path="${RUNNER_TEMP}/hmm-chat-notary-api-key.p8"
            printf '%s' "$HMM_MACOS_APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
            echo "APPLE_API_KEY=${api_key_path}" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=${HMM_MACOS_APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${HMM_MACOS_APPLE_API_ISSUER}" >> "$GITHUB_ENV"
          fi

      - name: Package desktop application
        run: npm run package:desktop

      - name: Verify packaged application contents, updater, and fuses
        run: npm run verify:desktop-package

      - name: Verify macOS release signing and notarization
        if: runner.os == 'macOS'
        run: npm run verify:desktop-package:macos-release

      - name: Address the update bucket by path
        shell: bash
        run: |
          # Self-hosted S3-compatible stores are addressed by path. The AWS CLI otherwise defaults
          # to virtual-host style and resolves <bucket>.<endpoint>, which has no DNS record.
          aws configure set default.s3.addressing_style path

      # Artifacts are served with a one-year immutable cache while the manifests are no-cache.
      # Re-publishing a version with different bytes would leave caches serving the old file
      # against a manifest advertising a new checksum, which fails verification on every client
      # until someone bumps the version. Refuse rather than corrupt the channel.
      - name: Refuse to overwrite an already published version
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: |
          existing="$(aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 ls \
            "s3://${HMM_UPDATE_S3_BUCKET}/desktop/hmm-chat-${DESKTOP_VERSION}-" 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$existing" != "0" ]]; then
            echo "Version ${DESKTOP_VERSION} is already published. Bump the version rather than re-running this tag." >&2
            exit 1
          fi

      - name: Upload versioned artifacts to the update bucket
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: |
          artifact_count=0
          while IFS= read -r artifact; do
            aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 cp \
              "$artifact" \
              "s3://${HMM_UPDATE_S3_BUCKET}/desktop/$(basename "$artifact")" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
            artifact_count=$((artifact_count + 1))
          done < <(
            find apps/desktop/release -maxdepth 1 -type f \
              -name "hmm-chat-${DESKTOP_VERSION}-*" -print
          )

          if [[ "$artifact_count" -eq 0 ]]; then
            echo "No versioned desktop artifacts were produced." >&2
            exit 1
          fi

      - name: Upload update metadata last
        shell: bash
        run: |
          metadata_count=0
          for metadata in apps/desktop/release/latest*.yml; do
            [[ -f "$metadata" ]] || continue
            aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 cp \
              "$metadata" \
              "s3://${HMM_UPDATE_S3_BUCKET}/desktop/$(basename "$metadata")" \
              --cache-control "no-cache" \
              --content-type "application/yaml" \
              --no-progress
            metadata_count=$((metadata_count + 1))
          done

          if [[ "$metadata_count" -eq 0 ]]; then
            echo "No latest update metadata was produced." >&2
            exit 1
          fi

      # The page reads the manifests at load time, so it does not go stale between releases and
      # one runner publishing it is enough.
      - name: Publish the download page
        if: runner.os == 'Linux'
        shell: bash
        run: |
          aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 cp \
            downloads/index.html \
            "s3://${HMM_UPDATE_S3_BUCKET}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8" \
            --no-progress
