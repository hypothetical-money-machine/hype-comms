name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: [self-hosted, Linux, X64, hmm-chat-release, docker]
    timeout-minutes: 5
    outputs:
      desktop-version: ${{ steps.version.outputs.desktop-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Require a tag matching the desktop package version
        id: version
        shell: bash
        run: |
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          # Every published build must be traceable to an immutable tag. workflow_dispatch stays
          # available for re-running a release, but only against a tag ref: on a branch dispatch
          # GITHUB_REF_TYPE is "branch", which previously short-circuited this guard and would
          # have let an unreviewed branch build overwrite the pilot's update feed.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Releases publish only from a tag. Dispatch against v${desktop_version} instead of a branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${desktop_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version ${desktop_version}." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} is not on origin/main." >&2
            exit 1
          fi
          echo "desktop-version=${desktop_version}" >> "$GITHUB_OUTPUT"

  package:
    name: Release ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: '["self-hosted", "macOS", "ARM64", "notarize"]'
            artifact_os: mac
            manifest: latest-mac.yml
          - platform: Windows
            runner: '["self-hosted", "Windows", "ARM64", "windows-release"]'
            artifact_os: win
            manifest: latest.yml
          - platform: Linux
            runner: '["self-hosted", "Linux", "X64", "hmm-chat-release", "docker"]'
            artifact_os: linux
            manifest: latest-linux.yml
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    env:
      # Endpoint, bucket, and region are not secret and live as repository variables. Only the
      # key pair is a secret, and it is scoped to write this one bucket.
      HMM_UPDATE_S3_ENDPOINT: ${{ vars.GARAGE_S3_ENDPOINT }}
      HMM_UPDATE_S3_BUCKET: ${{ vars.GARAGE_S3_BUCKET }}
      HMM_UPDATE_PUBLIC_ROOT: https://updates.hypemm.com/desktop
      UPDATE_ARTIFACT_OS: ${{ matrix.artifact_os }}
      UPDATE_MANIFEST: ${{ matrix.manifest }}
      AWS_REGION: ${{ vars.GARAGE_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.GARAGE_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Configure macOS signing and notarization
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          HMM_MACOS_CSC_LINK: ${{ secrets.HMM_MACOS_CSC_LINK }}
          HMM_MACOS_CSC_KEY_PASSWORD: ${{ secrets.HMM_MACOS_CSC_KEY_PASSWORD }}
          HMM_MACOS_APPLE_API_KEY_BASE64: ${{ secrets.HMM_MACOS_APPLE_API_KEY_BASE64 }}
          HMM_MACOS_APPLE_API_KEY_ID: ${{ secrets.HMM_MACOS_APPLE_API_KEY_ID }}
          HMM_MACOS_APPLE_API_ISSUER: ${{ secrets.HMM_MACOS_APPLE_API_ISSUER }}
        run: |
          if [[ -z "$HMM_MACOS_CSC_LINK" ||
                -z "$HMM_MACOS_CSC_KEY_PASSWORD" ||
                -z "$HMM_MACOS_APPLE_API_KEY_BASE64" ||
                -z "$HMM_MACOS_APPLE_API_KEY_ID" ||
                -z "$HMM_MACOS_APPLE_API_ISSUER" ]]; then
            echo "The macOS release requires signing and all notarization secrets." >&2
            exit 1
          fi

          umask 077
          certificate_path="${RUNNER_TEMP}/hmm-chat-signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/hmm-chat-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          api_key_path="${RUNNER_TEMP}/hmm-chat-notary-api-key.p8"

          # electron-builder's implicit keychain setup can pass the PKCS#12 password to
          # set-key-partition-list instead of its generated keychain password. Own the keychain
          # lifecycle here so signing works consistently on a clean self-hosted runner.
          printf '%s' "${HMM_MACOS_CSC_LINK#base64:}" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$HMM_MACOS_APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"

          security delete-keychain "$keychain_path" 2>/dev/null || rm -f "$keychain_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$HMM_MACOS_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          signing_identities="$(security find-identity -v -p codesigning "$keychain_path")"
          if [[ "$signing_identities" != *"Developer ID Application"* ]]; then
            echo "The signing certificate did not provide a Developer ID Application identity." >&2
            exit 1
          fi

          {
            echo "CSC_KEYCHAIN=${keychain_path}"
            echo "APPLE_API_KEY=${api_key_path}"
            echo "APPLE_API_KEY_ID=${HMM_MACOS_APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${HMM_MACOS_APPLE_API_ISSUER}"
          } >> "$GITHUB_ENV"

      - name: Package desktop application
        run: npm run package:desktop

      - name: Verify packaged application contents, updater, and fuses
        run: npm run verify:desktop-package

      - name: Verify macOS release signing and notarization
        if: matrix.platform == 'macOS'
        run: npm run verify:desktop-package:macos-release

      - name: Address the update bucket by path
        shell: bash
        run: |
          # Self-hosted S3-compatible stores are addressed by path. The AWS CLI otherwise defaults
          # to virtual-host style and resolves <bucket>.<endpoint>, which has no DNS record.
          echo "AWS_CONFIG_FILE=${RUNNER_TEMP}/hmm-chat-aws-config" >> "$GITHUB_ENV"
          export AWS_CONFIG_FILE="${RUNNER_TEMP}/hmm-chat-aws-config"
          aws configure set default.s3.addressing_style path

      # Artifacts are served with a one-year immutable cache while the manifests are no-cache.
      # The platform manifest is the commit marker: an orphan artifact from a failed run was never
      # advertised to clients and may be replaced on retry, but a manifested version is immutable.
      - name: Refuse to overwrite a published platform version
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: |
          node <<'NODE'
          const semver = require("semver");

          async function main() {
            const manifestUrl = new URL(
              process.env.UPDATE_MANIFEST,
              `${process.env.HMM_UPDATE_PUBLIC_ROOT}/`,
            );
            const response = await fetch(manifestUrl, {
              headers: { "cache-control": "no-cache" },
              redirect: "error",
              signal: AbortSignal.timeout(30_000),
            });
            if (response.status === 404) return;
            if (!response.ok) {
              throw new Error(`Could not inspect ${manifestUrl}: HTTP ${response.status}`);
            }

            const text = await response.text();
            const match = text.match(/^version:\s*['"]?([^'"\s]+)['"]?\s*$/m);
            if (match === null) throw new Error("Published manifest has no valid version");

            const publishedVersion = match[1];
            const desktopVersion = process.env.DESKTOP_VERSION;
            if (publishedVersion === desktopVersion) {
              throw new Error(
                `${process.env.UPDATE_MANIFEST} already publishes version ${desktopVersion}. ` +
                  "Bump the version rather than replacing it.",
              );
            }
            if (!semver.gt(desktopVersion, publishedVersion)) {
              throw new Error(
                `Refusing to move ${process.env.UPDATE_MANIFEST} backward from ` +
                  `${publishedVersion} to ${desktopVersion}.`,
              );
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Upload platform artifacts to the update bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: |
          artifact_count=0
          while IFS= read -r artifact; do
            aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 cp \
              "$artifact" \
              "s3://${HMM_UPDATE_S3_BUCKET}/desktop/$(basename "$artifact")" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
            artifact_count=$((artifact_count + 1))
          done < <(
            find apps/desktop/release -maxdepth 1 -type f \
              -name "hmm-chat-${DESKTOP_VERSION}-${UPDATE_ARTIFACT_OS}-*" -print
          )

          if [[ "$artifact_count" -eq 0 ]]; then
            echo "No ${UPDATE_ARTIFACT_OS} artifacts were produced for ${DESKTOP_VERSION}." >&2
            exit 1
          fi

      - name: Upload the platform manifest last
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: |
          metadata="apps/desktop/release/${UPDATE_MANIFEST}"
          if [[ ! -f "$metadata" ]]; then
            echo "${UPDATE_MANIFEST} was not produced." >&2
            exit 1
          fi
          metadata_version="$(
            node -e '
              const text = require("node:fs").readFileSync(process.argv[1], "utf8");
              const match = text.match(/^version:\s*['\''"]?([^'\''"\s]+)['\''"]?\s*$/m);
              if (match === null) throw new Error("Generated manifest has no valid version");
              process.stdout.write(match[1]);
            ' "$metadata"
          )"
          if [[ "$metadata_version" != "$DESKTOP_VERSION" ]]; then
            echo "${UPDATE_MANIFEST} contains ${metadata_version}, expected ${DESKTOP_VERSION}." >&2
            exit 1
          fi

          aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 cp \
            "$metadata" \
            "s3://${HMM_UPDATE_S3_BUCKET}/desktop/${UPDATE_MANIFEST}" \
            --cache-control "no-cache" \
            --content-type "application/yaml" \
            --no-progress

      - name: Verify the public platform release
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.validate.outputs.desktop-version }}
        run: node scripts/verify-published-desktop-release.mjs

      # The page reads the manifests at load time, so it does not go stale between releases and
      # one runner publishing it is enough.
      - name: Publish the download page
        if: matrix.platform == 'Linux'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
        run: |
          aws --endpoint-url "$HMM_UPDATE_S3_ENDPOINT" s3 cp \
            downloads/index.html \
            "s3://${HMM_UPDATE_S3_BUCKET}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      - name: Remove temporary macOS signing keychain
        if: always() && matrix.platform == 'macOS'
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/hmm-chat-signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/hmm-chat-signing.keychain-db"
          api_key_path="${RUNNER_TEMP}/hmm-chat-notary-api-key.p8"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$certificate_path" "$keychain_path" "$api_key_path"
