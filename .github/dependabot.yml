version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-runtime:
        dependency-type: production
      vite-stack:
        dependency-type: development
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - electron-vite
          - vitest
      npm-development:
        dependency-type: development
        exclude-patterns:
          - vite
          - "@vitejs/plugin-react"
          - electron-vite
          - vitest
    ignore:
      # typescript-eslint 8.65.0 peers typescript ">=4.8.4 <6.1.0".
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Major Vite stack upgrades are tested and landed atomically.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: electron-vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node runtime pinned in engines.node (24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
