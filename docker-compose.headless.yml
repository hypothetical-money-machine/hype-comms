services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: "no"
    environment:
      POSTGRES_DB: hype_comms_demo_test
      POSTGRES_PASSWORD: hype-comms-headless-test-password
      POSTGRES_USER: hype_comms
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und-x-icu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hype_comms -d hype_comms_demo_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    networks:
      - headless

  smoke:
    build:
      context: .
      dockerfile: scripts/headless-linux.Dockerfile
    init: true
    restart: "no"
    user: node
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HYPE_COMMS_POSTGRES_PASSWORD: hype-comms-headless-test-password
    command:
      - npm
      - run
      - test:demo:headless
      - --
      - --postgres=service
      - --flow=${HYPE_COMMS_HEADLESS_SMOKE_FLOW:-direct-message}
      - --timeout-ms=120000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    networks:
      - headless

networks:
  headless:
    internal: true
