name: hype-comms-actions-runner

services:
  linux-x64:
    platform: linux/amd64
    build:
      context: .github/runner
      args:
        AWS_CLI_VERSION: 2.36.9
        RUNNER_VERSION: 2.336.0
        RUNNER_SHA256_AMD64: 04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d
        RUNNER_SHA256_ARM64: 58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1
    image: hype-comms-actions-runner:2.336.0
    container_name: hype-comms-actions-runner-linux-x64
    init: true
    restart: unless-stopped
    environment:
      RUNNER_GROUP: ${HYPE_COMMS_X64_RUNNER_GROUP:-}
      RUNNER_LABELS: ${HYPE_COMMS_X64_RUNNER_LABELS:-hype-comms-release,docker}
      RUNNER_NAME: ${HYPE_COMMS_X64_RUNNER_NAME:-hype-comms-docker-linux-x64}
      RUNNER_URL: ${HYPE_COMMS_X64_RUNNER_URL:-https://github.com/hype-comms/hype-comms}
    volumes:
      - runner-data:/runner

  linux-arm64:
    platform: linux/arm64
    build:
      context: .github/runner
      args:
        AWS_CLI_VERSION: 2.36.9
        RUNNER_VERSION: 2.336.0
        RUNNER_SHA256_AMD64: 04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d
        RUNNER_SHA256_ARM64: 58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1
    image: hype-comms-actions-runner:2.336.0-arm64
    container_name: hype-comms-actions-runner-linux-arm64
    init: true
    restart: unless-stopped
    environment:
      RUNNER_GROUP: ${HYPE_COMMS_ARM64_RUNNER_GROUP:-}
      RUNNER_LABELS: ${HYPE_COMMS_ARM64_RUNNER_LABELS:-hype-comms-release,docker}
      RUNNER_NAME: ${HYPE_COMMS_ARM64_RUNNER_NAME:-hype-comms-docker-linux-arm64}
      RUNNER_URL: ${HYPE_COMMS_ARM64_RUNNER_URL:-https://github.com/hype-comms/hype-comms}
    volumes:
      - runner-data-arm64:/runner

volumes:
  runner-data:
    name: hype-comms-runner-data
  runner-data-arm64:
    name: hype-comms-runner-data-arm64
